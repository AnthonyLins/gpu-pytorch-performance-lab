[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-pytorch-performance-lab"
version = "0.1.0"
description = "Reproducible PyTorch, torch.compile, and Triton GPU benchmarks"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "triton>=3.0", "numpy>=1.26,<3", "pandas>=2.1,<3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
